<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>SGC - Login</title>

    <!-- CSS global do projeto -->
    <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<main class="login-container">
    <section class="login-card">
        <header class="login-header">
            <h1>SGC</h1>
            <p>Sistema de Gestão de Condomínio</p>
        </header>

        <form id="loginForm" class="login-form" novalidate>

            <label for="userType">Perfil</label>
            <select id="userType" name="userType" required>
                <option value="MORADOR">Morador</option>
                <option value="PORTEIRO">Porteiro</option>
                <option value="SINDICO">Síndico</option>
                <option value="FUNCIONARIO">Funcionário</option>
            </select>

            <label for="email">Email</label>
            <input
                    type="email"
                    id="email"
                    name="username"
                    placeholder="email@exemplo.com"
                    autocomplete="username"
                    required
            />

            <label for="senha">Senha</label>
            <div class="password-row">
                <input
                        type="password"
                        id="senha"
                        name="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                />
                <button type="button" id="toggleSenha" class="btn-secondary">
                    Mostrar
                </button>
            </div>

            <button id="btnLogin" type="submit" class="btn-primary">
                Entrar
            </button>

            <!-- Mensagem (compatível com o JS externo) -->
            <div id="msg" class="msg" style="display:none;"></div>

        </form>

        <footer class="login-footer">
            <small>© 2026 - Desenvolvido por Lucas Freitas</small>
        </footer>
    </section>
</main>

<script src="/js/script.js"></script>

</body>
</html>
