spring.application.name=SGC

# --- PROFILE ATIVO (carrega o application-local.properties com as credenciais) ---
spring.profiles.active=local

# --- BANCO DE DADOS (credenciais no application-local.properties) ---
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=condominio_db;encrypt=false}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- JWT (credenciais no application-local.properties) ---
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

api.security.token.secret=${JWT_SECRET}
