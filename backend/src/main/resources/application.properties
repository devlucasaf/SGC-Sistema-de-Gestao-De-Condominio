spring.application.name=SGC

spring.profiles.active=local

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;databaseName=condominio_db;encrypt=false}
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.initialization-fail-timeout=5000

jwt.secret=${JWT_SECRET:defaultSecretKeyChangeMe}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

api.security.token.secret=${JWT_SECRET:defaultSecretKeyChangeMe}
